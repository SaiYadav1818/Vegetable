spring:
  application:
    name: freshbasket-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/freshbasket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:freshbasket}
    password: ${DB_PASSWORD:freshbasket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
server:
  port: ${PORT:8080}
app:
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-must-be-at-least-32-bytes-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    credentials: ${FIREBASE_CREDENTIALS:}
    project-id: ${FIREBASE_PROJECT_ID:}
  notifications:
    retry-delay-ms: ${NOTIFICATION_RETRY_DELAY_MS:30000}

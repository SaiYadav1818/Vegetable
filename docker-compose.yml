services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: freshbasket
      MYSQL_USER: freshbasket
      MYSQL_PASSWORD: freshbasket
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-local-only"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
